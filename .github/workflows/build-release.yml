name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web app
      run: npm run build
      
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        ls -la /usr/lib/android-sdk 2>/dev/null || echo "No SDK at /usr/lib/android-sdk"
        ls -la /opt/android-sdk 2>/dev/null || echo "No SDK at /opt/android-sdk"
        
    - name: Sync Capacitor
      run: |
        npx cap add android || true
        npx cap sync android
        
    - name: Create local.properties
      run: |
        if [ -d "/usr/lib/android-sdk" ]; then
          echo "sdk.dir=/usr/lib/android-sdk" > android/local.properties
        elif [ -d "/opt/android-sdk" ]; then
          echo "sdk.dir=/opt/android-sdk" > android/local.properties
        else
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        fi
        cat android/local.properties
        
    - name: Build debug APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon || true
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: music-composer-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Check for APK
      run: |
        if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK构建成功！"
          ls -la android/app/build/outputs/apk/debug/app-debug.apk
        else
          echo "❌ APK构建失败"
          ls -la android/app/build/outputs/ 2>/dev/null || echo "No output directory"
        fi

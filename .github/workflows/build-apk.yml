name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Build web app
      run: npm run build

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: latest
        packages: 'platforms;android-36 build-tools;35.0.0 tools platform-tools'
        accept-android-sdk-licenses: true

    - name: Capacitor Sync
      run: npx cap sync android
        
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        
    - name: Build debug APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Verify APK
      run: |
        if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK构建成功！"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
        else
          echo "❌ APK构建失败"
          ls -la android/app/build/outputs/ 2>/dev/null || echo "Output directory not found"
          exit 1
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-composer-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Release v1.0.0 - APK安装包
        body: |
          🎵 **音乐创作大师 v1.0.0** - APK安装包发布

          ## 📥 下载APK
          在页面下方 Assets 中下载 `app-debug.apk`

          ## 📱 安装说明
          1. 下载APK文件
          2. 在手机上允许"安装未知来源应用"
          3. 点击APK文件安装

          ## 🎵 功能特性
          - ✅ 旋律编辑器：手动输入或AI生成旋律
          - ✅ 和弦走向编辑器：手动配置或AI生成和弦
          - ✅ 曲子生成器：一键生成完整歌曲
          - ✅ 播放控制：音频播放、音量调节
          - ✅ 多种风格：流行、古典、爵士、电子

          ## ⚠️ 系统要求
          - Android 6.0 (API 24) 或更高版本
        files: |
          android/app/build/outputs/apk/debug/app-debug.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
